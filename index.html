<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maps System</title>

  <!-- Google Maps API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBAeRc4o5wN__tvYrXKNKYyrgcwQnvSnhQ&libraries=places"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #loginScreen {
      position: fixed;
      inset: 0;
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #loginBox {
      background: #1f2937;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      color: white;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    #loginBox input {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
      box-sizing: border-box;
      font-size: 16px;
    }

    #loginBox button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    #app {
      display: none;
      height: 100%;
    }

    #sidebar {
      width: 320px;
      height: 100%;
      background: #f3f4f6;
      position: fixed;
      left: 0;
      top: 0;
      padding: 15px;
      box-sizing: border-box;
      border-right: 1px solid #d1d5db;
      overflow-y: auto;
      z-index: 10;
    }

    #mapContainer {
      margin-left: 320px;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .mapButton {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: white;
      border: 1px solid #d1d5db;
      text-align: left;
      font-size: 15px;
    }

    .mapButton:hover {
      background: #e5e7eb;
    }

    #searchInput {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      margin-bottom: 15px;
      box-sizing: border-box;
      font-size: 15px;
    }

    #miniMap {
      width: 100%;
      height: 250px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    @media (max-width: 768px) {

      #sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }

      #mapContainer {
        margin-left: 0;
        height: calc(100% - 500px);
      }

    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">

  <div id="loginBox">

    <h2>🔐 Доступ до карти</h2>

    <input
      type="password"
      id="passwordInput"
      placeholder="Введіть пароль"
    >

    <button onclick="checkPassword()">
      Увійти
    </button>

  </div>

</div>

<!-- APP -->
<div id="app">

  <!-- SIDEBAR -->
  <div id="sidebar">

    <h2>🗺️ Карти</h2>

    <!-- SEARCH -->
    <input
      type="text"
      id="searchInput"
      placeholder="Пошук міст / сіл"
    >

    <!-- MINI MAP -->
    <div id="miniMap"></div>

    <!-- MAPS -->

    <button class="mapButton"
      onclick="loadMap('https://www.google.com/maps/d/u/0/embed?mid=1ft_7LC679wKmp4ugU59aus0PY8dhW0M&ehbc=2E312F&noprof=1')">
      1-ДПРЗ
    </button>

    <button class="mapButton"
      onclick="loadMap('https://www.google.com/maps/d/u/0/embed?mid=18_oUcEtNwJGH2M6aY_O85O053OF8Z8k&ehbc=2E312F&noprof=1')">
      2-ДПРЗ
    </button>

    <button class="mapButton"
      onclick="loadMap('https://www.google.com/maps/d/u/0/embed?mid=1C4DmaswN9T1Rwn58RTev_HDAGaExXmA&ehbc=2E312F&noprof=1')">
      6-ДПРЗ
    </button>

    <button class="mapButton"
      onclick="loadMap('https://www.google.com/maps/d/u/0/embed?mid=1ANEDTSMTCzZ9xCG9rO2CSHSTSVkwnGc&ehbc=2E312F&noprof=1')">
      9-ДПРЗ
    </button>

    <button class="mapButton"
      onclick="loadMap('https://www.google.com/maps/d/u/0/embed?mid=1f8AOwVQtWLFJZP-nw9zeZlUyGSHtBcg&ehbc=2E312F&noprof=1')">
      11-ДПРЗ
    </button>

    <button class="mapButton"
      onclick="loadMap('https://www.google.com/maps/d/u/0/embed?mid=1Nx0nH2aE_-M8qz97Ap2ipD0AYEDuKtY&ehbc=2E312F&noprof=1')">
      43-ДПРЧ
    </button>

  </div>

  <!-- MAIN MAP -->
  <div id="mapContainer">

    <iframe
      id="mapFrame"
      src="https://www.google.com/maps/d/u/0/embed?mid=1ft_7LC679wKmp4ugU59aus0PY8dhW0M&ehbc=2E312F&noprof=1">
    </iframe>

  </div>

</div>

<script>

const PASSWORD = "1234";

function checkPassword() {

  const input = document.getElementById("passwordInput").value;

  if (input === PASSWORD) {

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";

    initMiniMap();

  } else {

    alert("Невірний пароль");

  }
}

// LOAD MAP
function loadMap(url) {

  document.getElementById("mapFrame").src = url;

}

// MINI GOOGLE MAP
let miniMap;
let marker;
let autocomplete;

function initMiniMap() {

  miniMap = new google.maps.Map(document.getElementById("miniMap"), {
    center: { lat: 50.4501, lng: 30.5234 },
    zoom: 7
  });

  marker = new google.maps.Marker({
    map: miniMap
  });

  const input = document.getElementById("searchInput");

  autocomplete = new google.maps.places.Autocomplete(input);

  autocomplete.addListener("place_changed", () => {

    const place = autocomplete.getPlace();

    if (!place.geometry || !place.geometry.location) return;

    miniMap.panTo(place.geometry.location);

    miniMap.setZoom(13);

    marker.setPosition(place.geometry.location);

  });

}

</script>

</body>
</html>
