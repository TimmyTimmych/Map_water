<!DOCTYPE html>
<html>
<head>
  <title>Map Water</title>

  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_NEW_API_KEY"></script>

 <script>
  let map;

  function initMap() {

    map = new google.maps.Map(document.getElementById("map"), {
      zoom: 12,
      center: { lat: 50.4501, lng: 30.5234 }
    });

    const kmlLayer = new google.maps.KmlLayer({
      url: "https://raw.githubusercontent.com/timmytimmych/Map_water/main/map.kml",
      map: map,
      preserveViewport: true
    });

  }
</script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #map {
      height: 100%;
      width: 100%;
    }
  </style>
</head>

<body onload="initMap()">
  <div id="map"></div>
</body>
</html>
